name: HopOn Full-Stack CI/CD Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Project Dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Audit Project Structure & Files
      run: |
        echo "Verifying presence of core files..."
        test -f index.html || (echo "Error: index.html is missing" && exit 1)
        test -f supabase-compat.js || (echo "Error: supabase-compat.js is missing" && exit 1)
        test -f supabase_schema.sql || (echo "Error: supabase_schema.sql is missing" && exit 1)
        test -f netlify/functions/create-payment-intent.js || (echo "Error: Payment Netlify function is missing" && exit 1)
        echo "All core full-stack production assets present."

    - name: Syntax Linting Check (Netlify Functions)
      run: |
        echo "Running syntax check on serverless functions..."
        node --check netlify/functions/create-payment-intent.js
        node --check netlify/functions/get-stripe-config.js
        node --check retrieve-payment-method.js || true
        node --check create-setup-intent.js || true
        echo "Syntax validation successful."
